<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>✨ Quản lý Prompt Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          animation: {
            'pulse-slow': 'pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'fade-in': 'fadeIn 0.3s ease-out'
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0', transform: 'translateY(10px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' }
            }
          }
        }
      }
    }
  </script>
  <style>
    .mic-button {
      transition: all 0.2s ease;
      padding: 0.5rem;
      border-radius: 50%;
      cursor: pointer;
    }
    .mic-button:hover { transform: scale(1.1); }
    .mic-button.recording {
      background-color: #ef4444;
      color: white;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      50% { box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); }
    }
    #voice-status {
      text-align: center;
      color: #6b7280;
      margin-top: 0.5rem;
      min-height: 1.5rem;
      font-size: 0.875rem;
      transition: color 0.2s;
    }
    #voice-status.error { color: #ef4444; }
    #voice-status.success { color: #22c55e; }
    
    /* Toast notification */
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 12px 20px;
      border-radius: 8px;
      color: white;
      font-weight: 500;
      z-index: 1000;
      animation: slideIn 0.3s ease, fadeOut 0.3s ease 2.7s forwards;
      max-width: 300px;
    }
    .toast.success { background: #22c55e; }
    .toast.error { background: #ef4444; }
    .toast.info { background: #3b82f6; }
    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    @keyframes fadeOut {
      from { opacity: 1; }
      to { opacity: 0; }
    }
    
    /* Truncated content */
    .content-preview {
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .content-expanded { -webkit-line-clamp: unset; }
    
    /* Dark mode transitions */
    * { transition: background-color 0.2s, border-color 0.2s, color 0.2s; }
    
    /* Loading spinner */
    .spinner {
      width: 20px; height: 20px;
      border: 2px solid #e5e7eb;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    /* Search highlight */
    .highlight { background: #fef08a; padding: 0 2px; border-radius: 2px; }
    
    /* Keyboard shortcut hint */
    .shortcut-hint {
      font-size: 0.75rem;
      color: #9ca3af;
      margin-left: 4px;
    }
    @media (max-width: 640px) {
      .shortcut-hint { display: none; }
    }
  </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 min-h-screen p-4 transition-colors">
  <div class="max-w-6xl mx-auto bg-white dark:bg-gray-800 shadow-lg rounded-xl p-6 transition-colors">
    
    <!-- Header -->
    <div class="flex flex-wrap items-center justify-between gap-4 mb-6 pb-4 border-b dark:border-gray-700">
      <h1 class="text-2xl font-bold text-indigo-600 dark:text-indigo-400">📚 Quản lý Prompt Pro</h1>
      <div class="flex items-center gap-3">
        <button id="darkModeToggle" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700" title="Chuyển chế độ tối/sáng">
          <span id="darkModeIcon">🌙</span>
        </button>
        <div class="text-sm text-gray-500 dark:text-gray-400">
          <span id="statsTotal">0</span> prompts
        </div>
      </div>
    </div>

    <!-- Form thêm/sửa Prompt -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4 p-4 bg-gray-50 dark:bg-gray-700/50 rounded-lg">
      <div class="flex items-center gap-2">
        <input id="title" type="text" placeholder="Tiêu đề *" class="border dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded p-2 w-full focus:ring-2 focus:ring-indigo-500 outline-none" />
        <button id="mic-title" class="mic-button text-gray-600 dark:text-gray-300 hover:text-indigo-500" title="Nhập bằng giọng nói (Ctrl+1)">🎤</button>
      </div>
      <div class="flex items-center gap-2 md:col-span-2">
        <input id="content" type="text" placeholder="Nội dung hoặc URL *" class="border dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded p-2 w-full focus:ring-2 focus:ring-indigo-500 outline-none" />
        <button id="mic-content" class="mic-button text-gray-600 dark:text-gray-300 hover:text-indigo-500" title="Nhập bằng giọng nói (Ctrl+2)">🎤</button>
      </div>
      <div class="flex items-center gap-2">
        <input id="category" type="text" placeholder="Danh mục *" class="border dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded p-2 w-full focus:ring-2 focus:ring-indigo-500 outline-none" list="categoryList" />
        <datalist id="categoryList"></datalist>
        <button id="mic-category" class="mic-button text-gray-600 dark:text-gray-300 hover:text-indigo-500" title="Nhập bằng giọng nói (Ctrl+3)">🎤</button>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="flex flex-wrap gap-2 mb-4">
      <button id="btnAdd" class="bg-indigo-500 hover:bg-indigo-600 text-white px-4 py-2 rounded-lg flex items-center gap-1 transition">
        <span id="addBtnText">➕</span> <span id="addBtnLabel">Thêm Prompt</span>
      </button>
      <button id="btnCancel" class="hidden bg-gray-400 hover:bg-gray-500 text-white px-4 py-2 rounded-lg transition">❌ Hủy sửa</button>
      
      <div class="w-px h-8 bg-gray-300 dark:bg-gray-600 mx-2"></div>
      
      <button onclick="exportPrompts()" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg flex items-center gap-1 transition">
        ⬇️ Xuất JSON
      </button>
      <input type="file" id="importFile" class="hidden" accept=".json" onchange="importPrompts(event)" />
      <button onclick="document.getElementById('importFile').click()" class="bg-yellow-500 hover:bg-yellow-600 text-white px-4 py-2 rounded-lg transition">
        ⬆️ Nhập
      </button>
      
      <div class="w-px h-8 bg-gray-300 dark:bg-gray-600 mx-2"></div>
      
      <input id="deleteCategoryInput" type="text" placeholder="Xoá danh mục..." class="border dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded p-2 text-sm" />
      <button onclick="deleteCategory()" class="bg-red-500 hover:bg-red-600 text-white px-3 py-2 rounded-lg text-sm transition">
        🗑️ Xoá
      </button>
      <button onclick="clearAllPrompts()" class="bg-red-700 hover:bg-red-800 text-white px-3 py-2 rounded-lg text-sm transition">
        ⚠️ Xoá tất cả
      </button>
    </div>

    <!-- View Controls -->
    <div class="flex flex-wrap items-center gap-4 mb-4 p-3 bg-gray-50 dark:bg-gray-700/50 rounded-lg">
      <label class="font-medium dark:text-gray-200">Hiển thị:</label>
      <select id="viewMode" onchange="renderPrompts()" class="border dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded p-2 text-sm">
        <option value="grouped">📁 Theo danh mục</option>
        <option value="all">📋 Tất cả</option>
      </select>
      
      <div id="categoryFilterWrap" class="flex items-center gap-2">
        <label class="font-medium dark:text-gray-200">Lọc:</label>
        <select id="categoryFilter" onchange="renderPrompts()" class="border dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded p-2 text-sm">
          <option value="all">Tất cả danh mục</option>
        </select>
      </div>
      
      <label class="font-medium dark:text-gray-200">Sắp xếp:</label>
      <select id="sortBy" onchange="renderPrompts()" class="border dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded p-2 text-sm">
        <option value="newest">🕐 Mới nhất</option>
        <option value="oldest">🕑 Cũ nhất</option>
        <option value="title">🔤 Tiêu đề (A-Z)</option>
        <option value="category">📁 Danh mục</option>
      </select>
    </div>

    <!-- Search -->
    <input id="search" oninput="renderPrompts()" type="text" 
      placeholder="🔍 Tìm kiếm (Ctrl+K)..." 
      class="w-full border dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg p-3 mb-4 focus:ring-2 focus:ring-indigo-500 outline-none transition" 
    />

    <!-- Voice Status -->
    <div id="voice-status" class="text-sm"></div>

    <!-- Prompt List -->
    <div id="promptList" class="space-y-4 min-h-[200px]"></div>
    
    <!-- Empty State -->
    <div id="emptyState" class="hidden text-center py-12 text-gray-500 dark:text-gray-400">
      <div class="text-4xl mb-2">📭</div>
      <p>Chưa có prompt nào. Hãy thêm prompt đầu tiên của bạn!</p>
      <p class="text-sm mt-1">Mẹo: Nhấn <kbd class="px-2 py-0.5 bg-gray-200 dark:bg-gray-600 rounded text-xs">Ctrl+N</kbd> để thêm nhanh</p>
    </div>

    <!-- Pagination -->
    <div id="pagination" class="mt-6 flex justify-center gap-2 flex-wrap"></div>
    
    <!-- Storage Warning -->
    <div id="storageWarning" class="hidden mt-4 p-3 bg-yellow-100 dark:bg-yellow-900/30 text-yellow-800 dark:text-yellow-200 rounded-lg text-sm">
      ⚠️ Dung lượng lưu trữ sắp đầy. Hãy xuất backup để giải phóng không gian.
    </div>
  </div>

  <!-- Keyboard Shortcuts Help -->
  <div class="fixed bottom-4 left-4 text-xs text-gray-400 dark:text-gray-500 hidden md:block">
    <kbd class="px-1.5 py-0.5 bg-gray-200 dark:bg-gray-700 rounded">Ctrl+K</kbd> Tìm kiếm
    <kbd class="px-1.5 py-0.5 bg-gray-200 dark:bg-gray-700 rounded ml-1">Ctrl+N</kbd> Mới
    <kbd class="px-1.5 py-0.5 bg-gray-200 dark:bg-gray-700 rounded ml-1">Ctrl+S</kbd> Lưu
  </div>

  <script>
    // ============ CONFIG & STATE ============
    const CONFIG = {
      itemsPerPage: 5,
      maxContentPreview: 200,
      storageQuotaWarning: 4 * 1024 * 1024 // 4MB
    };

    let state = {
      prompts: [],
      editingIndex: -1,
      currentPage: 1,
      recognition: null,
      isRecording: false,
      currentMicTarget: null,
      darkMode: localStorage.getItem('darkMode') === 'true'
    };

    // ============ UTILITY FUNCTIONS ============
    const $ = (id) => document.getElementById(id);
    
    const generateId = () => crypto.randomUUID?.() || Date.now().toString(36) + Math.random().toString(36).substr(2);
    
    const escapeHtml = (text) => {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    };
    
    const showToast = (message, type = 'info', duration = 3000) => {
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), duration);
    };
    
    const highlightText = (text, search) => {
      if (!search) return escapeHtml(text);
      const regex = new RegExp(`(${escapeHtml(search).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
      return escapeHtml(text).replace(regex, '<span class="highlight">$1</span>');
    };
    
    const truncateText = (text, maxLength) => {
      if (!text || text.length <= maxLength) return text;
      return text.substring(0, maxLength) + '...';
    };
    
    const checkStorageQuota = () => {
      try {
        const data = localStorage.getItem('prompts');
        if (data && data.length > CONFIG.storageQuotaWarning) {
          $('storageWarning').classList.remove('hidden');
          return false;
        }
        $('storageWarning').classList.add('hidden');
        return true;
      } catch {
        showToast('Lỗi truy cập localStorage!', 'error');
        return false;
      }
    };

    // ============ SPEECH RECOGNITION ============
    function setupSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const statusEl = $('voice-status');
      
      if (!SpeechRecognition) {
        statusEl.textContent = '⚠️ Trình duyệt không hỗ trợ nhận diện giọng nói. Dùng Chrome để có trải nghiệm tốt nhất.';
        statusEl.className = 'error';
        ['mic-title', 'mic-content', 'mic-category'].forEach(id => $(id).disabled = true);
        return;
      }

      state.recognition = new SpeechRecognition();
      state.recognition.lang = 'vi-VN';
      state.recognition.continuous = false;
      state.recognition.interimResults = false;

      state.recognition.onstart = () => {
        state.isRecording = true;
        state.currentMicTarget?.classList.add('recording');
        statusEl.textContent = '🎤 Đang nghe...';
        statusEl.className = 'success';
      };

      state.recognition.onend = () => {
        state.isRecording = false;
        state.currentMicTarget?.classList.remove('recording');
        if (statusEl.textContent.includes('Đang nghe')) {
          statusEl.textContent = '';
          statusEl.className = '';
        }
      };

      state.recognition.onerror = (event) => {
        state.isRecording = false;
        state.currentMicTarget?.classList.remove('recording');
        const errors = {
          'no-speech': 'Không nhận được giọng nói. Hãy thử lại.',
          'audio-capture': 'Không tìm thấy microphone.',
          'not-allowed': 'Vui lòng cấp quyền sử dụng microphone.',
          'network': 'Lỗi kết nối mạng.',
          'service-not-allowed': 'Dịch vụ nhận diện bị chặn.'
        };
        statusEl.textContent = `❌ ${errors[event.error] || 'Lỗi: ' + event.error}`;
        statusEl.className = 'error';
        showToast(statusEl.textContent, 'error');
      };

      state.recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript.trim();
        if (!transcript) return;
        
        const targetMap = {
          'mic-title': 'title',
          'mic-content': 'content', 
          'mic-category': 'category'
        };
        const fieldId = targetMap[state.currentMicTarget?.id];
        if (fieldId) {
          $(fieldId).value = transcript;
          $(fieldId).focus();
        }
        
        statusEl.textContent = `✅ Đã nhập: "${transcript}"`;
        statusEl.className = 'success';
        showToast('🎤 Nhập liệu bằng giọng nói thành công!', 'success', 2000);
      };
    }

    function toggleMic(targetId) {
      if (!state.recognition) return;
      const target = $(targetId);
      if (!target || target.disabled) return;
      
      state.currentMicTarget = target;
      
      if (state.isRecording) {
        state.recognition.stop();
      } else {
        // Request microphone permission first
        navigator.mediaDevices.getUserMedia({ audio: true })
          .then(() => state.recognition.start())
          .catch(err => {
            showToast('❌ Không thể truy cập microphone: ' + err.message, 'error');
            $('voice-status').textContent = 'Lỗi microphone';
            $('voice-status').className = 'error';
          });
      }
    }

    // ============ CORE FUNCTIONS ============
    function saveToStorage() {
      if (!checkStorageQuota()) return;
      localStorage.setItem('prompts', JSON.stringify(state.prompts));
      updateStats();
    }

    function loadFromStorage() {
      try {
        const data = localStorage.getItem('prompts');
        state.prompts = data ? JSON.parse(data) : [];
        // Add IDs to old prompts without IDs
        state.prompts.forEach(p => {
          if (!p.id) p.id = generateId();
          if (!p.createdAt) p.createdAt = Date.now();
        });
      } catch (e) {
        console.error('Lỗi load dữ liệu:', e);
        showToast('Lỗi đọc dữ liệu lưu trữ!', 'error');
        state.prompts = [];
      }
    }

    function updateStats() {
      $('statsTotal').textContent = state.prompts.length;
      
      // Update category datalist
      const categories = [...new Set(state.prompts.map(p => p.category).filter(Boolean))];
      const datalist = $('categoryList');
      datalist.innerHTML = categories.map(cat => `<option value="${escapeHtml(cat)}">`).join('');
    }

    function getFilteredAndSortedPrompts() {
      const search = $('search').value.toLowerCase().trim();
      const viewMode = $('viewMode').value;
      const categoryFilter = $('categoryFilter').value;
      const sortBy = $('sortBy').value;
      
      let filtered = state.prompts.filter(p => {
        const matchesSearch = !search || 
          p.title.toLowerCase().includes(search) || 
          p.content.toLowerCase().includes(search) ||
          p.category.toLowerCase().includes(search);
        const matchesCategory = viewMode === 'all' || categoryFilter === 'all' || p.category === categoryFilter;
        return matchesSearch && matchesCategory;
      });
      
      // Sort
      filtered.sort((a, b) => {
        switch (sortBy) {
          case 'oldest': return a.createdAt - b.createdAt;
          case 'title': return a.title.localeCompare(b.title, 'vi');
          case 'category': return a.category.localeCompare(b.category, 'vi');
          default: return b.createdAt - a.createdAt; // newest
        }
      });
      
      return filtered;
    }

    function renderPrompts() {
      const promptList = $('promptList');
      const emptyState = $('emptyState');
      const filtered = getFilteredAndSortedPrompts();
      const search = $('search').value.toLowerCase();
      
      // Update category filter options
      if ($('viewMode').value === 'grouped') {
        $('categoryFilterWrap').classList.remove('hidden');
        const categories = [...new Set(state.prompts.map(p => p.category).filter(Boolean))];
        const filter = $('categoryFilter');
        const current = filter.value;
        filter.innerHTML = '<option value="all">Tất cả danh mục</option>' + 
          categories.map(cat => `<option value="${escapeHtml(cat)}">${escapeHtml(cat)}</option>`).join('');
        filter.value = categories.includes(current) ? current : 'all';
      } else {
        $('categoryFilterWrap').classList.add('hidden');
      }
      
      // Empty state
      if (filtered.length === 0) {
        promptList.innerHTML = '';
        emptyState.classList.remove('hidden');
        $('pagination').innerHTML = '';
        return;
      }
      emptyState.classList.add('hidden');
      
      const viewMode = $('viewMode').value;
      
      if (viewMode === 'all') {
        // Flat list view
        renderFlatList(filtered, search, promptList);
        renderPagination(Math.ceil(filtered.length / CONFIG.itemsPerPage), (page) => {
          const start = (page - 1) * CONFIG.itemsPerPage;
          const pageItems = filtered.slice(start, start + CONFIG.itemsPerPage);
          promptList.innerHTML = '';
          pageItems.forEach(p => promptList.appendChild(createPromptCard(p, search)));
        });
      } else {
        // Grouped by category
        renderGroupedList(filtered, search, promptList);
      }
    }

    function createPromptCard(prompt, searchQuery) {
      const div = document.createElement('div');
      div.className = 'border dark:border-gray-600 p-4 rounded-lg shadow-sm bg-gray-50 dark:bg-gray-700/50 hover:shadow-md transition animate-fade-in';
      div.dataset.promptId = prompt.id;
      
      const isUrl = prompt.content?.startsWith('http');
      const contentDisplay = isUrl 
        ? `<a href="${escapeHtml(prompt.content)}" target="_blank" rel="noopener" class="text-blue-500 hover:text-blue-600 hover:underline break-all">🔗 ${escapeHtml(prompt.content)}</a>`
        : `<div class="content-preview" id="content-${prompt.id}">${highlightText(truncateText(prompt.content, CONFIG.maxContentPreview), searchQuery)}</div>` +
          (prompt.content?.length > CONFIG.maxContentPreview 
            ? `<button onclick="toggleContent('${prompt.id}')" class="text-indigo-500 text-sm mt-1 hover:underline">Xem thêm</button>` 
            : '');
      
      const dateStr = prompt.createdAt ? new Date(prompt.createdAt).toLocaleDateString('vi-VN') : '';
      
      div.innerHTML = `
        <div class="flex flex-wrap items-start justify-between gap-2 mb-2">
          <div class="flex items-center gap-2 flex-1 min-w-0">
            <h3 class="font-semibold text-gray-800 dark:text-gray-100 truncate" title="${escapeHtml(prompt.title)}">
              ${highlightText(prompt.title, searchQuery)}
            </h3>
            <span class="px-2 py-0.5 bg-indigo-100 dark:bg-indigo-900/50 text-indigo-700 dark:text-indigo-300 text-xs rounded-full whitespace-nowrap">
              ${escapeHtml(prompt.category)}
            </span>
          </div>
          <span class="text-xs text-gray-400 dark:text-gray-500 whitespace-nowrap">${dateStr}</span>
        </div>
        <div class="text-gray-600 dark:text-gray-300 text-sm mb-3">${contentDisplay}</div>
        <div class="flex flex-wrap gap-2">
          <button onclick="copyPrompt('${prompt.id}')" class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-1.5 rounded text-sm flex items-center gap-1 transition">
            📋 Sao chép
          </button>
          <button onclick="editPrompt('${prompt.id}')" class="bg-yellow-500 hover:bg-yellow-600 text-white px-3 py-1.5 rounded text-sm flex items-center gap-1 transition">
            ✏️ Sửa
          </button>
          <button onclick="deletePrompt('${prompt.id}')" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1.5 rounded text-sm flex items-center gap-1 transition">
            🗑️ Xoá
          </button>
        </div>
      `;
      return div;
    }

    function renderFlatList(prompts, searchQuery, container) {
      const start = (state.currentPage - 1) * CONFIG.itemsPerPage;
      const pageItems = prompts.slice(start, start + CONFIG.itemsPerPage);
      container.innerHTML = '';
      pageItems.forEach(p => container.appendChild(createPromptCard(p, searchQuery)));
    }

    function renderGroupedList(prompts, searchQuery, container) {
      // Group by category
      const groups = {};
      prompts.forEach(p => {
        if (!groups[p.category]) groups[p.category] = [];
        groups[p.category].push(p);
      });
      
      const categories = Object.keys(groups).sort((a, b) => a.localeCompare(b, 'vi'));
      const totalPages = Math.ceil(categories.length / CONFIG.itemsPerPage);
      const start = (state.currentPage - 1) * CONFIG.itemsPerPage;
      const visibleCategories = categories.slice(start, start + CONFIG.itemsPerPage);
      
      container.innerHTML = '';
      
      visibleCategories.forEach(cat => {
        const section = document.createElement('div');
        section.className = 'mb-6 animate-fade-in';
        section.innerHTML = `
          <h2 class="text-lg font-semibold text-indigo-600 dark:text-indigo-400 mb-3 pb-2 border-b dark:border-gray-600 flex items-center gap-2">
            <span>📁</span> ${escapeHtml(cat)} 
            <span class="text-sm font-normal text-gray-400">(${groups[cat].length})</span>
          </h2>
        `;
        
        groups[cat].forEach(p => {
          section.appendChild(createPromptCard(p, searchQuery));
        });
        
        container.appendChild(section);
      });
      
      renderPagination(totalPages, (page) => {
        state.currentPage = page;
        renderPrompts();
      });
    }

    function toggleContent(promptId) {
      const el = $(`content-${promptId}`);
      if (!el) return;
      el.classList.toggle('content-expanded');
      const btn = el.nextElementSibling;
      if (btn?.tagName === 'BUTTON') {
        btn.textContent = el.classList.contains('content-expanded') ? 'Thu gọn' : 'Xem thêm';
      }
    }

    function renderPagination(totalPages, onPageChange) {
      const pagination = $('pagination');
      pagination.innerHTML = '';
      
      if (totalPages <= 1) return;
      
      // Previous button
      const prevBtn = document.createElement('button');
      prevBtn.innerHTML = '◀';
      prevBtn.className = `px-3 py-1.5 rounded ${state.currentPage === 1 ? 'bg-gray-200 dark:bg-gray-700 text-gray-400 cursor-not-allowed' : 'bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600'}`;
      prevBtn.disabled = state.currentPage === 1;
      prevBtn.onclick = () => { if (state.currentPage > 1) { state.currentPage--; onPageChange(state.currentPage); } };
      pagination.appendChild(prevBtn);
      
      // Page numbers
      for (let i = 1; i <= totalPages; i++) {
        // Show first, last, and around current page
        if (i === 1 || i === totalPages || (i >= state.currentPage - 1 && i <= state.currentPage + 1)) {
          const btn = document.createElement('button');
          btn.textContent = i;
          btn.className = `px-3 py-1.5 rounded font-medium transition ${i === state.currentPage ? 'bg-indigo-500 text-white' : 'bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600'}`;
          btn.onclick = () => { state.currentPage = i; onPageChange(i); };
          pagination.appendChild(btn);
        } else if (i === state.currentPage - 2 || i === state.currentPage + 2) {
          const span = document.createElement('span');
          span.textContent = '...';
          span.className = 'px-2 py-1.5 text-gray-400';
          pagination.appendChild(span);
        }
      }
      
      // Next button
      const nextBtn = document.createElement('button');
      nextBtn.innerHTML = '▶';
      nextBtn.className = `px-3 py-1.5 rounded ${state.currentPage === totalPages ? 'bg-gray-200 dark:bg-gray-700 text-gray-400 cursor-not-allowed' : 'bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600'}`;
      nextBtn.disabled = state.currentPage === totalPages;
      nextBtn.onclick = () => { if (state.currentPage < totalPages) { state.currentPage++; onPageChange(state.currentPage); } };
      pagination.appendChild(nextBtn);
    }

    // ============ CRUD OPERATIONS ============
    function addOrUpdatePrompt() {
      const title = $('title').value.trim();
      const content = $('content').value.trim();
      const category = $('category').value.trim();
      
      if (!title || !content || !category) {
        showToast('⚠️ Vui lòng nhập đầy đủ thông tin!', 'error');
        return;
      }
      
      // Check for duplicate title (when adding new)
      if (state.editingIndex < 0) {
        const exists = state.prompts.some(p => p.title.toLowerCase() === title.toLowerCase() && p.category === category);
        if (exists) {
          if (!confirm('⚠️ Prompt với tiêu đề này đã tồn tại trong danh mục. Bạn có muốn tiếp tục?')) {
            return;
          }
        }
      }
      
      const promptData = {
        id: state.editingIndex >= 0 ? state.prompts[state.editingIndex].id : generateId(),
        title,
        content,
        category,
        createdAt: state.editingIndex >= 0 ? state.prompts[state.editingIndex].createdAt : Date.now(),
        updatedAt: Date.now()
      };
      
      if (state.editingIndex >= 0) {
        state.prompts[state.editingIndex] = promptData;
        state.editingIndex = -1;
        $('btnAdd').innerHTML = '<span id="addBtnText">➕</span> <span id="addBtnLabel">Thêm Prompt</span>';
        $('btnCancel').classList.add('hidden');
        showToast('✅ Đã cập nhật prompt!', 'success');
      } else {
        state.prompts.push(promptData);
        showToast('✅ Đã thêm prompt mới!', 'success');
      }
      
      // Reset form
      $('title').value = '';
      $('content').value = '';
      $('category').value = '';
      
      saveToStorage();
      renderPrompts();
    }

    function deletePrompt(promptId) {
      if (!confirm('🗑️ Bạn có chắc muốn xoá prompt này?')) return;
      
      const index = state.prompts.findIndex(p => p.id === promptId);
      if (index >= 0) {
        const deleted = state.prompts.splice(index, 1)[0];
        saveToStorage();
        renderPrompts();
        showToast(`✅ Đã xoá: "${deleted.title}"`, 'info');
        
        // Simple undo
        setTimeout(() => {
          if (!document.querySelector(`[data-prompt-id="${promptId}"]`)) {
            // Prompt still deleted, offer undo
            const undoBtn = document.createElement('button');
            undoBtn.textContent = 'Hoàn tác';
            undoBtn.className = 'ml-2 text-indigo-500 hover:underline text-sm';
            undoBtn.onclick = () => {
              state.prompts.splice(index, 0, deleted);
              saveToStorage();
              renderPrompts();
              showToast('↩️ Đã hoàn tác xoá', 'success');
            };
            // Could add to a temporary undo bar (simplified here)
          }
        }, 3000);
      }
    }

    function editPrompt(promptId) {
      const prompt = state.prompts.find(p => p.id === promptId);
      if (!prompt) return;
      
      $('title').value = prompt.title;
      $('content').value = prompt.content;
      $('category').value = prompt.category;
      
      state.editingIndex = state.prompts.findIndex(p => p.id === promptId);
      
      $('btnAdd').innerHTML = '<span id="addBtnText">✏️</span> <span id="addBtnLabel">Cập nhật</span>';
      $('btnCancel').classList.remove('hidden');
      
      $('title').focus();
      showToast('✏️ Đang chỉnh sửa. Nhấn Lưu hoặc Hủy', 'info', 4000);
    }

    function cancelEdit() {
      state.editingIndex = -1;
      $('title').value = '';
      $('content').value = '';
      $('category').value = '';
      $('btnAdd').innerHTML = '<span id="addBtnText">➕</span> <span id="addBtnLabel">Thêm Prompt</span>';
      $('btnCancel').classList.add('hidden');
    }

    async function copyPrompt(promptId) {
      const prompt = state.prompts.find(p => p.id === promptId);
      if (!prompt) return;
      
      try {
        await navigator.clipboard.writeText(prompt.content);
        showToast('📋 Đã sao chép vào clipboard!', 'success', 2000);
      } catch {
        // Fallback
        const textarea = document.createElement('textarea');
        textarea.value = prompt.content;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        showToast('📋 Đã sao chép!', 'success', 2000);
      }
    }

    function deleteCategory() {
      const cat = $('deleteCategoryInput').value.trim();
      if (!cat) {
        showToast('⚠️ Nhập tên danh mục cần xoá', 'error');
        return;
      }
      
      const count = state.prompts.filter(p => p.category === cat).length;
      if (count === 0) {
        showToast(`❌ Không tìm thấy prompt trong "${cat}"`, 'error');
        return;
      }
      
      if (!confirm(`🗑️ Xoá ${count} prompt trong danh mục "${cat}"? Hành động này không thể hoàn tác!`)) return;
      
      state.prompts = state.prompts.filter(p => p.category !== cat);
      $('deleteCategoryInput').value = '';
      saveToStorage();
      renderPrompts();
      showToast(`✅ Đã xoá ${count} prompt`, 'success');
    }

    function clearAllPrompts() {
      if (state.prompts.length === 0) {
        showToast('📭 Không có dữ liệu để xoá', 'info');
        return;
      }
      
      if (!confirm('⚠️ CẢNH BÁO: Xoá TẤT CẢ prompt? Hành động này KHÔNG THỂ hoàn tác!')) return;
      
      // Double confirmation
      const confirmText = prompt('Gõ "XOA" để xác nhận xoá tất cả:');
      if (confirmText === 'XOA') {
        state.prompts = [];
        saveToStorage();
        renderPrompts();
        showToast('🗑️ Đã xoá toàn bộ dữ liệu', 'info');
      } else {
        showToast('❌ Đã huỷ thao tác', 'error');
      }
    }

    // ============ IMPORT/EXPORT ============
    function exportPrompts() {
      if (state.prompts.length === 0) {
        showToast('📭 Không có dữ liệu để xuất', 'info');
        return;
      }
      
      const data = JSON.stringify(state.prompts, null, 2);
      const blob = new Blob([data], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const date = new Date().toISOString().split('T')[0];
      a.href = url;
      a.download = `prompts-backup-${date}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      
      showToast(`✅ Đã xuất ${state.prompts.length} prompt`, 'success');
    }

    function importPrompts(event) {
      const file = event.target.files[0];
      if (!file) return;
      
      if (file.type !== 'application/json' && !file.name.endsWith('.json')) {
        showToast('❌ Chỉ hỗ trợ file .json', 'error');
        return;
      }
      
      // Show loading
      const originalBtnText = event.target.nextElementSibling.innerHTML;
      event.target.nextElementSibling.innerHTML = '<span class="spinner"></span> Đang xử lý...';
      event.target.nextElementSibling.disabled = true;
      
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const imported = JSON.parse(e.target.result);
          
          if (!Array.isArray(imported)) {
            throw new Error('File phải chứa một mảng các prompt');
          }
          
          // Validate and normalize
          const validPrompts = imported
            .filter(p => p?.title && p?.content && p?.category)
            .map(p => ({
              id: p.id || generateId(),
              title: String(p.title).trim(),
              content: String(p.content).trim(),
              category: String(p.category).trim(),
              createdAt: p.createdAt || Date.now(),
              updatedAt: Date.now()
            }));
          
          // Merge: skip duplicates by ID or (title + category)
          const existingKeys = new Set(state.prompts.map(p => p.id || `${p.title}|${p.category}`));
          const newPrompts = validPrompts.filter(p => {
            const key = p.id || `${p.title}|${p.category}`;
            return !existingKeys.has(key);
          });
          
          if (newPrompts.length === 0) {
            showToast('⚠️ Không có prompt mới để nhập', 'info');
          } else {
            state.prompts = [...state.prompts, ...newPrompts];
            saveToStorage();
            renderPrompts();
            showToast(`✅ Nhập thành công ${newPrompts.length} prompt mới!`, 'success');
          }
          
        } catch (err) {
          console.error('Import error:', err);
          showToast(`❌ Lỗi: ${err.message}`, 'error');
        } finally {
          // Restore button
          event.target.nextElementSibling.innerHTML = originalBtnText;
          event.target.nextElementSibling.disabled = false;
          event.target.value = ''; // Reset file input
        }
      };
      
      reader.onerror = () => {
        showToast('❌ Không thể đọc file', 'error');
        event.target.nextElementSibling.innerHTML = originalBtnText;
        event.target.nextElementSibling.disabled = false;
      };
      
      reader.readAsText(file);
    }

    // ============ DARK MODE ============
    function toggleDarkMode() {
      state.darkMode = !state.darkMode;
      localStorage.setItem('darkMode', state.darkMode);
      document.documentElement.classList.toggle('dark', state.darkMode);
      $('darkModeIcon').textContent = state.darkMode ? '☀️' : '🌙';
    }

    function initDarkMode() {
      if (state.darkMode) {
        document.documentElement.classList.add('dark');
        $('darkModeIcon').textContent = '☀️';
      }
    }

    // ============ KEYBOARD SHORTCUTS ============
    function setupKeyboardShortcuts() {
      document.addEventListener('keydown', (e) => {
        // Ignore when typing in inputs
        if (['INPUT', 'TEXTAREA'].includes(e.target.tagName)) {
          // Allow Ctrl+Enter to submit
          if (e.ctrlKey && e.key === 'Enter') {
            e.preventDefault();
            addOrUpdatePrompt();
          }
          return;
        }
        
        // Ctrl+K: Focus search
        if (e.ctrlKey && e.key.toLowerCase() === 'k') {
          e.preventDefault();
          $('search').focus();
          $('search').select();
          showToast('🔍 Nhập từ khoá để tìm kiếm', 'info', 1500);
        }
        
        // Ctrl+N: New prompt
        if (e.ctrlKey && e.key.toLowerCase() === 'n') {
          e.preventDefault();
          $('title').focus();
          showToast('✏️ Nhập thông tin prompt mới', 'info', 1500);
        }
        
        // Ctrl+S: Save (when editing)
        if (e.ctrlKey && e.key.toLowerCase() === 's') {
          e.preventDefault();
          addOrUpdatePrompt();
        }
        
        // Escape: Cancel edit
        if (e.key === 'Escape' && state.editingIndex >= 0) {
          cancelEdit();
        }
        
        // Voice shortcuts: Ctrl+1/2/3
        if (e.ctrlKey && ['1', '2', '3'].includes(e.key)) {
          e.preventDefault();
          const targets = { '1': 'mic-title', '2': 'mic-content', '3': 'mic-category' };
          toggleMic(targets[e.key]);
        }
      });
    }

    // ============ INITIALIZATION ============
    function init() {
      // Load data
      loadFromStorage();
      initDarkMode();
      
      // Setup features
      setupSpeechRecognition();
      setupKeyboardShortcuts();
      
      // Event listeners for mic buttons
      ['mic-title', 'mic-content', 'mic-category'].forEach(id => {
        $(id)?.addEventListener('click', () => toggleMic(id));
      });
      
      // Form buttons
      $('btnAdd').onclick = addOrUpdatePrompt;
      $('btnCancel').onclick = cancelEdit;
      $('darkModeToggle').onclick = toggleDarkMode;
      
      // Enter key on inputs
      ['title', 'content', 'category'].forEach(id => {
        $(id)?.addEventListener('keypress', (e) => {
          if (e.key === 'Enter' && !e.ctrlKey) {
            e.preventDefault();
            const next = { title: 'content', content: 'category', category: 'btnAdd' }[id];
            if (next === 'btnAdd') {
              addOrUpdatePrompt();
            } else {
              $(next)?.focus();
            }
          }
        });
      });
      
      // Initial render
      renderPrompts();
      
      // Welcome message
      if (state.prompts.length === 0) {
        setTimeout(() => {
          showToast('👋 Chào mừng! Bắt đầu bằng cách thêm prompt đầu tiên 🎉', 'info', 5000);
        }, 1000);
      }
    }

    // Start app when DOM ready
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
